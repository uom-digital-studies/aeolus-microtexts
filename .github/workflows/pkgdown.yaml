# Publishes the locally built, committed `site/` directory.
# Build locally with pkgdown::build_site_github_pages(dest_dir = "site") (or build_site()) and commit.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: pkgdown.yaml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy are separate jobs: in a single job, deploy-pages can list
# artifacts before GitHub registers the just-finished upload ("Found 0
# artifact(s)"). If deploy fails, use "Re-run failed jobs" (not "Re-run all
# jobs") so a second github-pages artifact isn't uploaded to the same run.
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
